name: Build Arkari for Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # 【新增步】核心伪装：在编译前强行篡改 Git 仓库地址
    - name: Hide Repository URL
      run: |
        git remote set-url origin https://github.com/Protect/Protect.git

    - name: Setup MSVC and Ninja
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Install vcpkg dependencies
      run: |
        vcpkg install zlib:x64-windows-static
        vcpkg install libLZMA:x64-windows-static
        vcpkg install libxml2:x64-windows-static
        echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV

    - name: Configure CMake
      run: |
        mkdir build_ninja
        cd build_ninja
        cmake -G Ninja ..\llvm `
          -DCMAKE_BUILD_TYPE=Release `
          -DLLVM_ENABLE_PROJECTS="clang" `
          -DLLVM_TARGETS_TO_BUILD="X86;AArch64" `
          -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded `
          -DCMAKE_INSTALL_PREFIX="./install" `
          -DLLVM_INCLUDE_TESTS=OFF `
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
          -DCMAKE_CXX_FLAGS="/utf-8 /fno-ident" `
          -DCMAKE_C_FLAGS="/utf-8 /fno-ident" `
          -DPACKAGE_VENDOR="Protect" `
          -DLLVM_APPEND_VC_REV=OFF

    - name: Build
      run: |
        cd build_ninja
        ninja

    - name: Upload Complete Artifact
      uses: actions/upload-artifact@v4
      with:
        name: arkari-clang-llvm18-complete
        path: |
          build_ninja/bin/
          build_ninja/lib/clang/
